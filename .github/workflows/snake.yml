name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: Platane/snk@v3
        with:
          github_user_name: abdalrahmanx9
          outputs: |
            output/github-contribution-grid-snake.svg?color_snake=#58A6FF&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353
            output/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#58A6FF
            output/github-contribution-grid-snake.gif?palette=github-dark&color_snake=#58A6FF&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update snake animation"
